<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Actividades Fmax</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-card">
        <h2>Iniciar Sesión</h2>
        <p>Actividades FMAX</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="user_usuario">Usuario</label>
                <input type="text" id="user_usuario" required placeholder="Ingrese su usuario">
            </div>

            <div class="form-group">
                <label for="user_password">Contraseña</label>
                <input type="password" id="user_password" required placeholder="Ingrese su contraseña">
            </div>

            <button type="submit">Ingresar</button>
        </form>

        <div id="alert" class="alert hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
