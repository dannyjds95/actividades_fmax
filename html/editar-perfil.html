<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Actividades FMAX</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Editar Información de Usuario</h2>
        <div id="alert" class="alert hidden"></div>

        <form id="editForm">
            <h3>Datos Personales</h3>
            <label>Nombre:</label>
            <input type="text" id="nombre" required>

            <label>Cédula:</label>
            <input type="text" id="cedula" required>

            <label>Teléfono:</label>
            <input type="text" id="telefono">

            <label>Dirección:</label>
            <input type="text" id="direccion">

            <h3>Valores y Tarifas</h3>
            <label>Valor Actividad:</label>
            <input type="number" step="0.01" id="valor_act">

            <label>Valor Visita:</label>
            <input type="number" step="0.01" id="valor_visita">

            <label>Valor Punto de Red:</label>
            <input type="number" step="0.01" id="valor_pred">

            <label>Valor Instalación AC:</label>
            <input type="number" step="0.01" id="valor_ac">

            <label>Valor Excedente:</label>
            <input type="number" step="0.01" id="valor_exc">

            <div style="margin-top: 20px;">
                <button type="submit" class="btn-primary">Guardar Cambios</button>
                <a href="perfil.html" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

    <script src="../js/editar-perfil.js"></script>
</body>
</html>
