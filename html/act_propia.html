<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Actividad Propia</title>
    <link rel="stylesheet" href="../css/act_propia.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h2>Registro de Actividad</h2>
        </div>

        <form id="actividadForm">
            <!-- Campos Ocultos (Se envían al backend pero no se muestran) -->
            <input type="hidden" id="user_id" name="user_id">
            <input type="hidden" id="tipo_registro" name="tipo_registro" value="ACTIVIDAD PROPIA">

            <!-- Fila 1: Cliente, Fecha, Sector, Tipo -->
            <div class="form-grid-2">

                                <div class="form-group">
                    <label for="act_fecha">Fecha *</label>
                    <input type="date" id="act_fecha" name="act_fecha" required>
                </div>

                <div class="form-group">
                    <label for="act_cliente">Nombre del Cliente</label>
                    <input type="text" id="act_cliente" name="act_cliente" placeholder="Ej: Juan Pérez (Opcional)">
                </div>


            </div>

            <div class="form-grid-2">

                                <div class="form-group">
                    <label for="act_tipo">Tipo de Actividad *</label>
                    <select id="act_tipo" name="act_tipo" required>
                        <option value="">Seleccione Tipo de actividad</option>
                        <option value="INSTALACION">INSTALACION</option>
                        <option value="TRASLADO">TRASLADO</option>
                        <option value="VISITA">VISITA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="act_forma">Forma de Actividad *</label>
                    <select id="act_forma" name="act_forma" required></select>
                </div>





            </div>

            <!-- Fila 2: Forma, Cantidad Fibra -->
            <div class="form-grid-2">
                

                                <div class="form-group">
                    <label for="act_sector">Sector *</label>
                    <select id="act_sector" name="act_sector" required>
                        <option value="">Seleccione Sector</option>
                        <option value="NORTE">NORTE</option>
                        <option value="CENTRO">CENTRO</option>
                        <option value="SUR">SUR</option>
                        <option value="VALLES">VALLES</option>
                    </select>
                </div>



                <div class="form-group">
                    <label for="act_fibra">Cantidad Fibra (metros)</label>
                    <input type="number" id="act_fibra" name="act_fibra" value="0" min="0">
                </div>
            </div>

            <!-- Fila 3: Opciones Radio (Puntos Red y Equipos AC) -->
            <div class="form-grid-2 form-inline-radios">
                <div class="form-group radio-box">
                    <label>¿Instaló puntos de red?</label>
                    <div class="radio-options">
                        <label><input type="radio" name="has_pred" value="NO" checked> NO</label>
                        <label><input type="radio" name="has_pred" value="SI"> SI</label>
                        <select id="act_pred_qty" class="select-small hidden">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                </div>

                <div class="form-group radio-box">
                    <label>¿Instaló Equipos AC?</label>
                    <div class="radio-options">
                        <label><input type="radio" name="has_ac" value="NO" checked> NO</label>
                        <label><input type="radio" name="has_ac" value="SI"> SI</label>
                        <select id="act_ac_qty" class="select-small hidden">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Fila 4: Detalle y Cobro de Valores -->
            <div class="form-grid-2">


                <div class="form-group radio-box">
                    <label>¿Cobró valores?</label>
                    <div class="radio-options">
                        <label><input type="radio" name="has_cobro" value="NO" checked> NO</label>
                        <label><input type="radio" name="has_cobro" value="SI"> SI</label>
                        <input type="number" step="0.01" id="act_valores_cobrados" class="input-small hidden" placeholder="$ 0.00" value="0">
                    </div>
                </div>

                                <div class="form-group">
                    <label for="act_detalle">Comentario / Detalle</label>
                    <textarea id="act_detalle" name="act_detalle" rows="2" placeholder="Observaciones adicionales..."></textarea>
                </div>
            </div>

            <!-- Tarjeta Resumen de Cálculos Automáticos -->
            <div class="summary-card">
                <div class="summary-grid">
                    <div>
                        <span class="summary-label">CANTIDAD</span>
                        <strong id="lbl_cantidad">0</strong>
                    </div>
                    <div>
                        <span class="summary-label">VALOR ACTIVIDAD</span>
                        <strong id="lbl_valor_act">$0.00</strong>
                    </div>
                    <div>
                        <span class="summary-label">PUNTO DE RED</span>
                        <strong id="lbl_valor_pred">$0.00</strong>
                    </div>
                    <div>
                        <span class="summary-label">EQUIPO AC</span>
                        <strong id="lbl_valor_ac">$0.00</strong>
                    </div>
                    <div>
                        <span class="summary-label">EXCEDENTE (M)</span>
                        <strong id="lbl_excedente_m">0</strong>
                    </div>
                    <div>
                        <span class="summary-label">VALOR EXCEDENTE</span>
                        <strong id="lbl_valor_exc">$0.00</strong>
                    </div>
                </div>
                <div class="total-box">
                    <span>TOTAL ACTIVIDAD</span>
                    <h3 id="lbl_total">$0.00</h3>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="window.history.back()">Cancelar</button>
                <button type="submit" id="btnSubmit" class="btn-submit">Guardar Actividad</button>
            </div>
        </form>
    </div>

    <script src="../js/act_propia.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/perfil.js"></script>
    <script src="../js/layout.js"></script>

    <!-- Script para auto-asignar Fecha Actual -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fechaInput = document.getElementById('act_fecha');
            if (fechaInput && !fechaInput.value) {
                const hoy = new Date();
                const year = hoy.getFullYear();
                const month = String(hoy.getMonth() + 1).padStart(2, '0');
                const day = String(hoy.getDate()).padStart(2, '0');
                fechaInput.value = `${year}-${month}-${day}`;
            }
        });
    </script>
</body>
</html>
