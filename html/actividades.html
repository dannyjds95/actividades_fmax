<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades</title>
    <link rel="icon" type="image/png" href="../image/logo.png">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/actividades.css">
</head>
<body>

    <!-- Capa Oscura de Fondo para Dispositivos Móviles -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="app-layout">
        <!-- MENÚ LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../image/logo.png" alt="Logo" style="height: 28px; width: auto;" onerror="this.style.display='none'">
                <h2 id="userName">FMAX</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="actividades.html" class="nav-item active">
                    <span class="nav-icon">📋</span>
                    <span class="nav-label">Actividades</span>
                </a>
                <a href="perfil.html" class="nav-item">
                    <span class="nav-icon">👤</span>
                    <span class="nav-label">Mi Perfil</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">Configuración</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button type="button" id="btnLogoutSidebar" class="nav-item btn-logout-sidebar">
                    <span class="nav-icon">🚪</span>
                    <span class="nav-label">Cerrar Sesión</span>
                </button>
            </div>
        </aside>

<!-- Contenido Principal -->
        <main class="main-content">
            <!-- Tarjeta de Filtros -->
            <div class="filter-card">
                <div class="filter-grid">
                    <div class="filter-group">
                        <label for="select_periodo">Período</label>
                        <select id="select_periodo" class="form-control">
                            <option value="">Cargando períodos...</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="fecha_desde">Desde</label>
                        <input type="date" id="fecha_desde" class="form-control">
                    </div>

                    <div class="filter-group">
                        <label for="fecha_hasta">Hasta</label>
                        <input type="date" id="fecha_hasta" class="form-control">
                    </div>

                    <div class="filter-group">
                        <label for="filter_tipo">Tipo</label>
                        <select id="filter_tipo" class="form-control">
                            <option value="">TODOS</option>
                            <option value="INSTALACION">INSTALACIÓN</option>
                            <option value="TRASLADO">TRASLADO</option>
                            <option value="VISITA">VISITA</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="filter_sector">Sector</label>
                        <input type="text" id="filter_sector" class="form-control" placeholder="Ej. Norte, Centro...">
                    </div>

                    <div class="filter-group">
                        <label for="filter_cobradas">Cobradas</label>
                        <select id="filter_cobradas" class="form-control">
                            <option value="">TODAS</option>
                            <option value="si">SOLO COBRADAS (> $0)</option>
                            <option value="no">SIN COBRAR ($0)</option>
                        </select>
                    </div>

                    <div class="filter-group button-group">
                        <button id="btn_registrar" class="btn btn-primary" onclick="window.location.href='registrar.html'">
                            + Registrar Actividad
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="table-card">
                <div class="table-header">
                    <h3>Registros de Actividades</h3>
                    <span id="txt_total_registros" class="badge-count">0 registros</span>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>FECHA</th>
                                <th>CLIENTE</th>
                                <th>TIPO</th>
                                <th>FORMA</th>
                                <th>FIBRA</th>
                                <th>EXCEDENTE</th>
                                <th>PT. RED</th>
                                <th>AC</th>
                                <th>TOTAL</th>
                                <th>V. COBRADOS</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tbl_actividades_body">
                            <tr>
                                <td colspan="11" class="text-center">Cargando actividades...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/actividades.js"></script>
</body>
</html>
